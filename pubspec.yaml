name: mindmate
description: "MindMate - Your Personal Wellness Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  model_viewer_plus: ^1.10.0
  just_audio: ^0.10.6
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/illustrations/
    - assets/audio/
    - assets/audio/breathing/box/
    - assets/audio/breathing/four_seven_eight/
    - assets/audio/breathing/simple_calm/
    - assets/audio/meditation/stress_relief/quick_reset/
    - assets/audio/meditation/stress_relief/release_tension/
    - assets/audio/meditation/stress_relief/calm_the_storm/
    - assets/audio/meditation/sleep/wind_down/
    - assets/audio/meditation/sleep/quiet_night/
    - assets/audio/meditation/sleep/deep_rest/
    - assets/audio/meditation/focus/clear_mind/
    - assets/audio/meditation/focus/pre_study_focus/
    - assets/audio/meditation/focus/deep_work_prep/
    - assets/audio/meditation/anxiety/grounding/
    - assets/audio/meditation/anxiety/steady_breath/
    - assets/audio/meditation/anxiety/anxious_thoughts_softened/
    - assets/audio/meditation/gratitude/small_joys/
    - assets/audio/meditation/gratitude/gratitude_for_people/
    - assets/audio/meditation/gratitude/end_of_day_thanks/
    - assets/audio/meditation/morning/fresh_start/
    - assets/audio/meditation/morning/set_an_intention/
    - assets/audio/meditation/morning/morning_clarity/
    - assets/audio/snapshot/
    - assets/audio/wellness_result/